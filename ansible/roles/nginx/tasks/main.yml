---
- name: Install Nginx
  apt:
    name: nginx
    state: present

- name: Template Nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/mywebapp
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx

- name: Enable Nginx site
  file:
    src: /etc/nginx/sites-available/mywebapp
    dest: /etc/nginx/sites-enabled/mywebapp
    state: link
  notify: reload nginx

- name: Remove default Nginx virtual host
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Ensure Nginx is running and enabled
  systemd:
    name: nginx
    state: started
    enabled: yes

- name: Allow HTTP traffic (Nginx) through UFW
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
